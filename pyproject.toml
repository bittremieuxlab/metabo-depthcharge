[build-system]
requires = ["setuptools>=68.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "metabo-depthcharge"
dynamic = ["version"]
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "rdkit>=2023.9.0",
    "myopic_mces>=1.0.0,<2.0.0",
    "h5py>=3.10.0",
    "biosynfoni>=1.0.0",
    "map4>=1.1.0",
]

[project.optional-dependencies]
nn = [
    "torch>=2.0.0",
    "lightning>=2.0.0",
    "depthcharge-ms>=0.4.9",
    "transformers>=4.30.0",
    "unimol_tools>=0.1.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
]

[tool.setuptools.packages.find]
include = ["metabo_depthcharge*"]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [".git", "__pycache__", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long
    "N803",   # argument name lowercase (scientific naming)
    "N806",   # variable lowercase (scientific naming)
    "N812",   # F imported as non-lowercase (torch.nn.functional as F)
    "SIM102", # nested if → keep original logic readable
    "SIM108", # ternary operator
    "UP031",  # %-format → keep original repr style
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"metabo_depthcharge/molecules/fingerprints.py" = ["B028", "B904", "UP038"]

[tool.ruff.lint.isort]
known-first-party = ["metabo_depthcharge"]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================================
# Pytest
# ============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers"]
markers = [
    "unit: fast isolated tests",
    "integration: slower tests that may need data or models",
    "slow: tests that take several seconds",
]
