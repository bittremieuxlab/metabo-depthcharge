[build-system]
requires = ["setuptools>=68.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "metabo-depthcharge"
dynamic = ["version"]
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "rdkit>=2023.9.0",
    "myopic_mces>=1.0.0,<2.0.0",
    "datasets>=2.14.0",
    "pyteomics>=4.6",
    "biosynfoni>=1.0.0",
    "map4>=1.1.0",
    "torch>=2.0.0",
    "lightning>=2.0.0",
    "depthcharge-ms>=0.4.9",
    "transformers>=4.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.15",
    "myst-parser>=2.0",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
]

[tool.setuptools.packages.find]
include = ["metabo_depthcharge*"]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [".git", "__pycache__", "build", "dist", "*.egg-info", "metabo_depthcharge/mist_cf"]
# Honor `exclude` even for paths passed explicitly (e.g. by pre-commit),
# otherwise mist_cf files get linted when staged.
force-exclude = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long
    "N803",   # argument name lowercase (scientific naming)
    "N806",   # variable lowercase (scientific naming)
    "N812",   # F imported as non-lowercase (torch.nn.functional as F)
    "SIM102", # nested if → keep original logic readable
    "SIM108", # ternary operator
    "UP031",  # %-format → keep original repr style
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["metabo_depthcharge"]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================================
# Pytest
# ============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers"]
markers = [
    "unit: fast isolated tests",
    "integration: slower tests that may need data or models",
    "slow: tests that take several seconds",
]

# ============================================================================
# Coverage
# ============================================================================

[tool.coverage.run]
omit = ["*/mist_cf/*"]
